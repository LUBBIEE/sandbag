nz(.18,180,'lowpass',.8,t+1.95)}

const mkN=(d,fq,ty,gv,st,at)=>{const L=Math.floor(44100*d),b=AC.createBuffer(1,L,44100),x=b.getChannelData(0);for(let i=0;i<L;i++)x[i]=Math.random()*2-1;const n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();n.buffer=b;f.type=ty;f.frequency.value=fq;g.gain.setValueAtTime(.0001,st);g.gain.linearRampToValueAtTime(gv,st+at);g.gain.exponentialRampToValueAtTime(.0001,st+d);n.connect(f);f.connect(g);g.connect(AC.destination);n.start(st)};
mkN(.05,2500,'highpass',.3,t,.004);mkN(.9,500,'bandpass',.25,t+.15,.45);mkN(1.2,260,'lowpass',.25,t+.5,.5);mkN(.18,180,'lowpass',.8,t+1.95,.01);
[1760,2349].forEach((fq,i)=>{const tt=t+.55+i*.09,o=AC.createOscillator(),g=AC.createGain();o.frequency.value=fq;g.gain.setValueAtTime(.06,tt);g.gain.exponentialRampToValueAtTime(.0001,tt+.7);o.connect(g);g.connect(AC.destination);o.start(tt);o.stop(tt+.8)})}
function creak2Old(){if(!AC)return;const t=AC.currentTime;
const mkN=(d,fq,ty,gv,st,at)=>{const L=Math.floor(44100*d),b=AC.createBuffer(1,L,44100),x=b.getChannelData(0);for(let i=0;i<L;i++)x[i]=Math.random()*2-1;const n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();n.buffer=b;f.type=ty;f.frequency.value=fq;g.gain.setValueAtTime(.0001,st);g.gain.linearRampToValueAtTime(gv,st+at);g.gain.exponentialRampToValueAtTime(.0001,st+d);n.connect(f);f.connect(g);g.connect(AC.destination);n.start(st)};
mkN(.06,2500,'highpass',.12,t,.005);mkN(1.6,350,'lowpass',.1,t+.1,.6);mkN(.15,200,'lowpass',.3,t+1.9,.01)}
function creakOld(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';
o.frequency.setValueAtTime(90,t);o.frequency.linearRampToValueAtTime(55,t+2);g.gain.setValueAtTime(.05,t);g.gain.linearRampToValueAtTime(0,t+2.2);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+2.3)}

// game state
const MSG=['대단한데?','진정해!','화가 많은걸?','뜨거워!!','아프겠다..','복싱선수야?','손이 안보여!'];
let best=0;try{best=+localStorage.getItem('jb')||0}catch(e){}$('best').textContent='최고 '+best;
let state='start',doorT=0,combo=0,last=0,popS=1,shake=0,flash=0,bx=0,bz=0,bvx=0,bvz=0,alt=0,timer=null;
function impact(o){const k=o.kind,hook=k.length>1,body=k[1]==='B',pw=hook?1:.65;
dents.push({t:Math.PI+o.sx*(hook?.55:.15),y:body?-.3:(hook?.5:.35),a:hook?.13:.09,s:.035});if(dents.length>7)dents.shift();
bvx+=pw*1.3;if(hook)bvz+=-o.sx*1.3;
shake=.03+.04*pw;flash=1;snd(pw);
combo++;last=performance.now();$('cn').textContent=combo;$('combo').style.opacity=1;popS=1.4;
if(combo>best){best=combo;$('best').textContent='최고 '+best;try{localStorage.setItem('jb',best)}catch(e){}}
if(combo%100===0){const m=$('msg');m.textContent=MSG[Math.floor(Math.random()*MSG.length)];m.classList.remove('go');void m.offsetWidth;m.classList.add('go')}}
function punch(kind){if(state!=='play'||rise<.85)return;const o=kind[0]==='L'?GL:GR;
if(o.t>=0&&o.t<.5)return;o.t=0;o.kind=kind;o.hit=false}
function startC(){if(timer)return;punch(alt++%2?'R':'L');timer=setInterval(()=>punch(alt++%2?'R':'L'),150)}
function stopC(){clearInterval(timer);timer=null}
function zone(e){const fx=e.clientX/innerWidth,fy=e.clientY/innerHeight;
if(fx<.33)return fy>.5?'LB':'LH';if(fx>.66)return fy>.5?'RB':'RH';return'C'}
const cv=$('c');
cv.addEventListener('pointerdown',e=>{const z=zone(e);z==='C'?startC():punch(z)});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,stopC));
const KM={KeyD:'LH',KeyF:'LB',KeyJ:'RB',KeyK:'RH'};
addEventListener('keydown',e=>{if(state!=='play')return;
if(e.code==='Space'){e.preventDefault();if(!e.repeat)startC();return}
if(!e.repeat&&KM[e.code])punch(KM[e.code])});
addEventListener('keyup',e=>{if(e.code==='Space')stopC()});

$('go').onclick=()=>{AC=new(window.AudioContext||window.webkitAudioContext)();$('st').classList.add('hide');state='door';doorT=0;setTimeout(creak,500)};
function showName(){state='name';riseT=0;stopC();$('nb').classList.remove('hide');$('re').classList.add('hide');$('hint').style.opacity=0}
$('ok').onclick=()=>{drawBag($('nm').value.trim()||'???');$('nm').blur();if(document.activeElement)document.activeElement.blur();$('nb').classList.add('hide');state='play';riseT=1;$('re').classList.remove('hide');
$('hint').style.opacity=1;setTimeout(()=>$('hint').style.opacity=0,4000)};
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')$('ok').onclick()});
$('re').onclick=showName;
$('gb').onclick=()=>$('gp').classList.remove('hide');$('gx').onclick=()=>$('gp').classList.add('hide');

const ez=t=>t<0?0:t>1?1:t*t*(3-2*t),cl=(t)=>Math.max(0,Math.min(1,t));
const REST=[V(-.34,-.4,-.75),V(.34,-.4,-.75)];
function updGlove(o,i,dt){
if(o.t>=0){o.t+=dt/.2;if(o.t>=.45&&!o.hit){o.hit=true;impact(o)}if(o.t>=1)o.t=-1}
const e=o.t<0?0:Math.sin(Math.PI*o.t),hook=o.kind.length>1,body=o.kind[1]==='B';
const r=REST[i],tx=o.sx*(hook?-.02:.08),ty=body?-.62:(hook?.5:-.05),tz=-1.5;
let x=r.x+(tx-r.x)*e,y=r.y+(ty-r.y)*e,z=r.z+(tz-r.z)*e;
if(hook&&o.t>=0)x+=o.sx*.5*Math.sin(Math.PI*o.t)*(1-e);
y+=(1-rise)*-1.1;
o.g.position.set(x,y,z);o.g.rotation.set(-.2*e,-o.sx*.25*(1-e)+(hook?o.sx*-.5*e:0),o.sx*.1)}

let prev=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;
if(state==='door'){doorT+=dt;const a=ez(cl((doorT-.6)/2))*1.6;DL.rotation.y=a;DR.rotation.y=-a;
C.position.z=11+(2.4-11)*ez(cl((doorT-1.4)/3.8));if(doorT>5.3)showName()}
rise+=(riseT-rise)*Math.min(1,dt*5);
updGlove(GL,0,dt);updGlove(GR,1,dt);const ft=fireTier(combo);updFire(GL,dt,ft);updFire(GR,dt,ft);
// bag physics
bvx+=(-30*bx-2.2*bvx)*dt;bvz+=(-30*bz-2.2*bvz)*dt;bx+=bvx*dt;bz+=bvz*dt;G.rotation.x=bx;G.rotation.z=bz;
if(dents.length){for(const d of dents)d.a*=Math.exp(-dt*.25);while(dents.length&&dents[0].a<.004)dents.shift();deform()}
flash*=Math.exp(-dt*9);bm.emissive.setRGB(flash*.45,flash*.04,0);
// combo
popS+=(1-popS)*Math.min(1,dt*12);$('cn').style.transform=`scale(${popS})`;
if(combo>0&&performance.now()-last>1000){if(combo>=2){const r=$('res');r.textContent=combo+' COMBO!';r.classList.remove('go');void r.offsetWidth;r.classList.add('go')}
combo=0;$('combo').style.opacity=0}
// camera
C.position.x=(Math.random()-.5)*shake;C.position.y=1.5+(Math.random()-.5)*shake;shake*=Math.exp(-dt*14);
C.lookAt(0,1.5,0);
bulb.intensity=1.5+(Math.random()<.04?-.9:0)+Math.sin(now/300)*.1;
R.render(S,C)}
requestAnimationFrame(loop);
